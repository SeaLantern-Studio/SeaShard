name: 发布 SeaShard

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，不带 v，例如 1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: seashard-release
  cancel-in-progress: false

jobs:
  validate:
    name: 校验版本并生成说明
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 校验版本号和目标 Tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/generate-release-notes.ts validate "$VERSION"
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "Tag v${VERSION} 已存在" >&2
            exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} 已存在" >&2
            exit 1
          fi

      - name: 生成完整 Changelog 和下载指引
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -n "$previous_tag" ]]; then
            git rev-parse --verify "refs/tags/${previous_tag}^{commit}" >/dev/null
          fi
          mkdir -p release-metadata
          node scripts/generate-release-notes.ts generate \
            "$VERSION" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" \
            release-metadata/release-notes.md \
            "$previous_tag"

      - name: 保存 Release 说明
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata/release-notes.md
          if-no-files-found: error
          retention-days: 1

  compile:
    name: 编译平台无关应用产物
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 编译 SeaShard
        run: pnpm run build

      - name: 保存平台无关应用产物
        uses: actions/upload-artifact@v4
        with:
          name: compiled-application
          path: |
            apps/desktop/dist
            apps/plugin-host/dist
            apps/database-worker/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: 构建 ${{ matrix.label }}
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            targets: nsis
            arch: x64
            asset_key: windows-x64
            update_channel: latest
            update_metadata: latest.yml
            supports_update: true
          - label: Windows ARM64
            runner: windows-latest
            platform: win
            targets: nsis
            arch: arm64
            asset_key: windows-arm64
            update_channel: latest-arm64
            update_metadata: latest-arm64.yml
            supports_update: true
          - label: macOS Intel x64
            runner: macos-latest
            platform: mac
            targets: dmg
            arch: x64
            asset_key: macos-x64
            update_channel: latest
            supports_update: false
          - label: macOS Apple Silicon
            runner: macos-latest
            platform: mac
            targets: dmg
            arch: arm64
            asset_key: macos-arm64
            update_channel: latest-arm64
            supports_update: false
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            targets: AppImage deb
            arch: x64
            asset_key: linux-x64
            update_channel: latest
            update_metadata: latest-linux.yml
            supports_update: true
          - label: Linux ARM64
            runner: ubuntu-latest
            platform: linux
            targets: AppImage deb
            arch: arm64
            asset_key: linux-arm64
            update_channel: latest
            update_metadata: latest-linux-arm64.yml
            supports_update: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 获取平台无关应用产物
        uses: actions/download-artifact@v4
        with:
          name: compiled-application
          path: apps

      - name: 构建平台安装包
        shell: bash
        run: >-
          pnpm exec electron-builder
          --${{ matrix.platform }}
          ${{ matrix.targets }}
          --${{ matrix.arch }}
          --publish never
          --config.extraMetadata.version=${{ inputs.version }}
          --config.publish.channel=${{ matrix.update_channel }}
          --config.artifactName="SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.\${ext}"

      - name: 保存平台产物
        uses: actions/upload-artifact@v4
        with:
          name: seashard-${{ matrix.asset_key }}
          path: |
            release/SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.exe
            release/SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.dmg
            release/SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.AppImage
            release/SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.deb
          if-no-files-found: error
          retention-days: 1

      - name: 保存一键更新元数据
        if: matrix.supports_update
        uses: actions/upload-artifact@v4
        with:
          name: seashard-update-${{ matrix.asset_key }}
          path: |
            release/${{ matrix.update_metadata }}
            release/SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.*.blockmap
          if-no-files-found: error
          retention-days: 1

  release:
    name: 创建 Tag 和 Release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出 Release 校验脚本
        uses: actions/checkout@v4

      - name: 汇总全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: seashard-*
          path: release-assets
          merge-multiple: true
      - name: 获取 Release 说明
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-assets

      - name: 校验 Release 资产集合
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/generate-release-notes.ts validate-assets "$VERSION" release-assets

      - name: 创建 Tag 并发布 Release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            release-assets/SeaShard-* \
            release-assets/latest*.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SeaShard ${VERSION}" \
            --notes-file release-assets/release-notes.md
          release_url="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          printf '## Release 已发布\n\n%s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
