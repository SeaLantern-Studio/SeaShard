name: 发布 SeaShard

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，不带 v，例如 1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: seashard-release
  cancel-in-progress: false

jobs:
  validate:
    name: 校验版本并生成说明
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 校验版本号和目标 Tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/generate-release-notes.ts validate "$VERSION"
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "Tag v${VERSION} 已存在" >&2
            exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} 已存在" >&2
            exit 1
          fi

      - name: 生成完整 Changelog 和下载指引
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -n "$previous_tag" ]]; then
            git rev-parse --verify "refs/tags/${previous_tag}^{commit}" >/dev/null
          fi
          mkdir -p release-metadata
          node scripts/generate-release-notes.ts generate \
            "$VERSION" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" \
            release-metadata/release-notes.md \
            "$previous_tag"

      - name: 保存 Release 说明
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata/release-notes.md
          if-no-files-found: error
          retention-days: 1

  compile:
    name: 编译平台无关应用产物
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 编译 SeaShard
        run: pnpm run build

      - name: 生成 Server npm 发布包
        shell: bash
        run: |
          mkdir -p release-server-npm
          node scripts/package-server-npm.mjs \
            --version=${{ inputs.version }}
          npm pack ./build/server-npm \
            --pack-destination release-server-npm

      - name: 保存平台无关应用产物
        uses: actions/upload-artifact@v4
        with:
          name: compiled-application
          path: |
            apps/desktop/dist
            apps/plugin-host/dist
            apps/database-worker/dist
            apps/host/dist
            apps/server/dist
          if-no-files-found: error
          retention-days: 1

      - name: 保存 Server npm 发布包
        uses: actions/upload-artifact@v4
        with:
          name: seashard-server-npm
          path: release-server-npm/seashard-server-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1

  build:
    name: 构建 ${{ matrix.label }}
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            targets: nsis
            arch: x64
            asset_key: windows-x64
            update_channel: latest
            update_metadata: latest.yml
            supports_update: true
          - label: Windows ARM64
            runner: windows-latest
            platform: win
            targets: nsis
            arch: arm64
            asset_key: windows-arm64
            update_channel: latest-arm64
            update_metadata: latest-arm64.yml
            supports_update: true
          - label: macOS Intel x64
            runner: macos-latest
            platform: mac
            targets: pkg
            arch: x64
            asset_key: macos-x64
            update_channel: latest
            supports_update: false
          - label: macOS Apple Silicon
            runner: macos-latest
            platform: mac
            targets: pkg
            arch: arm64
            asset_key: macos-arm64
            update_channel: latest-arm64
            supports_update: false
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            targets: AppImage deb
            arch: x64
            asset_key: linux-x64
            update_channel: latest
            update_metadata: latest-linux.yml
            supports_update: true
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            targets: AppImage deb
            arch: arm64
            asset_key: linux-arm64
            update_channel: latest
            update_metadata: latest-linux-arm64.yml
            supports_update: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 获取平台无关应用产物
        uses: actions/download-artifact@v4
        with:
          name: compiled-application
          path: apps

      - name: 构建独立 Host 安装包
        shell: bash
        run: |
          chmod +x \
            build/macos-host-scripts/postinstall \
            build/linux-host-after-install.tpl \
            build/linux-host-before-remove.sh \
            build/linux-controller-after-install.tpl \
            build/linux-host-after-remove.tpl
          pnpm exec electron-builder \
            --config electron-builder.host.yml \
            --${{ matrix.platform }} ${{ matrix.targets }} \
            --${{ matrix.arch }} \
            --publish never \
            --config.extraMetadata.version=${{ inputs.version }}
          mkdir -p release
          case "${{ matrix.platform }}" in
            win)
              cp build/host-installer/SeaShardHostSetup.exe \
                "release/SeaShard-Host-${{ matrix.asset_key }}.exe"
              ;;
            mac)
              cp build/host-installer/SeaShardHostSetup.pkg \
                "release/SeaShard-Host-${{ matrix.asset_key }}.pkg"
              ;;
            linux)
              chmod +x build/host-installer/SeaShardHostSetup.AppImage
              cp build/host-installer/SeaShardHostSetup.AppImage \
                "release/SeaShard-Host-${{ matrix.asset_key }}.AppImage"
              cp build/host-installer/SeaShardHostSetup.deb \
                "release/SeaShard-Host-${{ matrix.asset_key }}.deb"
              mkdir -p build/linux-controller-host-installer
              cp build/host-installer/SeaShardHostSetup.AppImage \
                build/linux-controller-host-installer/
              ;;
          esac

      - name: 获取 Server Node.js Runtime
        if: matrix.platform != 'mac'
        id: server-node
        shell: bash
        run: >-
          node scripts/download-node-runtime.mjs
          --node-version=24.11.0
          --platform=${{ matrix.platform == 'win' && 'windows' || 'linux' }}
          --arch=${{ matrix.arch }}
          --github-output="$GITHUB_OUTPUT"

      - name: 获取 AppImage 打包工具
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          tool_arch="${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}"
          curl --fail --location --silent --show-error \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${tool_arch}.AppImage" \
            --output build/appimagetool.AppImage
          chmod +x build/appimagetool.AppImage

      - name: 构建 Server Controller 安装文件
        if: matrix.platform != 'mac'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = win ]; then
            node scripts/stage-server-host-installer.mjs --platform=win32
            node scripts/package-server.mjs \
              --version=${{ inputs.version }} \
              --platform=windows \
              --arch=${{ matrix.arch }} \
              --node-executable="${{ steps.server-node.outputs.node_executable }}"
          else
            node scripts/stage-server-host-installer.mjs --platform=linux
            node scripts/package-server.mjs \
              --version=${{ inputs.version }} \
              --platform=linux \
              --arch=${{ matrix.arch }} \
              --node-executable="${{ steps.server-node.outputs.node_executable }}" \
              --appimage-tool=build/appimagetool.AppImage
          fi

      - name: 构建平台安装包
        shell: bash
        run: >-
          pnpm exec electron-builder
          --${{ matrix.platform }}
          ${{ matrix.targets }}
          --${{ matrix.arch }}
          --publish never
          --config.extraMetadata.version=${{ inputs.version }}
          --config.publish.channel=${{ matrix.update_channel }}
          --config.artifactName="SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.\${ext}"

      - name: 保存平台产物
        uses: actions/upload-artifact@v4
        with:
          name: seashard-${{ matrix.asset_key }}
          path: |
            release/SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.exe
            release/SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.pkg
            release/SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.AppImage
            release/SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.deb
            release/SeaShard-Host-${{ matrix.asset_key }}.exe
            release/SeaShard-Host-${{ matrix.asset_key }}.pkg
            release/SeaShard-Host-${{ matrix.asset_key }}.AppImage
            release/SeaShard-Host-${{ matrix.asset_key }}.deb
            release/SeaShard-Server-${{ inputs.version }}-${{ matrix.asset_key }}.zip
            release/SeaShard-Server-${{ inputs.version }}-${{ matrix.asset_key }}.tar.gz
            release/SeaShard-Server-${{ inputs.version }}-${{ matrix.asset_key }}.AppImage
            release/SeaShard-Server-${{ inputs.version }}-${{ matrix.asset_key }}.deb
          if-no-files-found: error
          retention-days: 1

      - name: 保存一键更新元数据
        if: matrix.supports_update
        uses: actions/upload-artifact@v4
        with:
          name: seashard-update-${{ matrix.asset_key }}
          path: |
            release/${{ matrix.update_metadata }}
            release/SeaShard-${{ inputs.version }}-${{ matrix.asset_key }}.*.blockmap
          if-no-files-found: error
          retention-days: 1

  release:
    name: 创建 Tag 和 Release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出 Release 校验脚本
        uses: actions/checkout@v4

      - name: 汇总全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: seashard-*
          path: release-assets
          merge-multiple: true
      - name: 获取 Release 说明
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-assets

      - name: 生成 Server 安装入口
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp scripts/install-server.sh release-assets/install-server.sh
          chmod +x release-assets/install-server.sh
          node scripts/generate-homebrew-formula.mjs \
            --version="$VERSION" \
            --repository="$GITHUB_REPOSITORY" \
            --assets=release-assets \
            --output=release-assets/seashard-server.rb

      - name: 生成全量 Release 清单
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          node scripts/generate-release-notes.ts generate-catalog
          "$VERSION"
          "$GITHUB_REPOSITORY"
          release-assets
          release-assets/latest-release.json

      - name: 校验 Release 资产集合
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/generate-release-notes.ts validate-assets "$VERSION" release-assets

      - name: 创建 Tag 并发布 Release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            release-assets/SeaShard-* \
            release-assets/seashard-* \
            release-assets/install-server.sh \
            release-assets/latest*.yml \
            release-assets/latest-release.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SeaShard ${VERSION}" \
            --notes-file release-assets/release-notes.md
          release_url="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          printf '## Release 已发布\n\n%s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"

  publish-server-npm:
    name: 发布 Server npm 包
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 获取 Server npm 包
        uses: actions/download-artifact@v4
        with:
          name: seashard-server-npm
          path: npm-package

      - name: 通过 npm Trusted Publishing 发布
        run: npm publish "npm-package/seashard-server-${{ inputs.version }}.tgz" --access public --provenance

  sync-homebrew:
    name: 同步仓库内 Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 更新 seashard-server Formula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p Formula formula-download
          gh release download "v${{ inputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern seashard-server.rb \
            --dir formula-download
          cp formula-download/seashard-server.rb Formula/seashard-server.rb
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/seashard-server.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(server): 更新 Homebrew 到 ${{ inputs.version }}"
            git push origin main
          fi
