name: 发布 npm · @seashard/plugin-sdk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 包版本号，不带 v，例如 0.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-plugin-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: 发布 @seashard/plugin-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACKAGE_NAME: "@seashard/plugin-sdk"
      VERSION: ${{ inputs.version }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: 配置 Node.js 与 npm Registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: 校验版本尚未发布
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-release-notes.ts validate "$VERSION"
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} 已存在，npm 版本不可覆盖" >&2
            exit 1
          fi

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并验证 SDK 发布包
        run: pnpm run verify:sdk

      - name: 写入发布版本
        run: npm pkg set "version=${VERSION}" --prefix packages/plugin-sdk/dist

      - name: 发布 npm 包
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "Repository Actions secret NPM_TOKEN 未配置" >&2
            exit 1
          fi
          npm publish ./packages/plugin-sdk/dist --access public

      - name: 核对 Registry 版本
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-npm-registry-version.mjs "$PACKAGE_NAME" "$VERSION"
          printf '## npm 包已发布\n\n`%s@%s`\n' "$PACKAGE_NAME" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
