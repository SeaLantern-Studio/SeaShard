appId: studio.sealantern.seashard
productName: SeaShard
copyright: Copyright © SeaLantern Studio
directories:
  output: release
publish:
  provider: github
  owner: SeaLantern-Studio
  repo: SeaShard
artifactName: SeaShardSetup.${ext}
files:
  - apps/desktop/dist/**/*
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
  - package.json
asar: true
asarUnpack:
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
npmRebuild: false
extraMetadata:
  main: apps/desktop/dist/main/index.js
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - pkg
  category: public.app-category.utilities
  sign: null
  extraResources:
    - from: scripts/uninstall-seashard.sh
      to: uninstaller/uninstall-seashard.sh
    - from: scripts/install-macos-uninstaller-app.sh
      to: uninstaller/install-macos-uninstaller-app.sh
pkg:
  scripts: build/macos-controller-scripts
linux:
  target:
    - AppImage
    - deb
  category: Utility
  extraResources:
    - from: scripts/uninstall-seashard.sh
      to: uninstaller/uninstall-seashard.sh
    - from: scripts/install-macos-uninstaller-app.sh
      to: uninstaller/install-macos-uninstaller-app.sh
    - from: build/linux-controller-host-installer/SeaShardHostSetup.AppImage
      to: host-installer/SeaShardHostSetup.AppImage
    - from: build/linux-host-appimage-install.sh
      to: host-installer/install.sh
deb:
  afterInstall: build/linux-controller-after-install.tpl
  # Controller 自身的 Electron Runtime 直接链接 ALSA；使用替代依赖同时覆盖新式
  # t64 发行版和仍提供旧包名的 Debian/Ubuntu。
  fpm:
    - --depends
    - libasound2t64 | libasound2
