appId: studio.sealantern.seashard
productName: SeaShard
copyright: Copyright © SeaLantern Studio
directories:
  output: release
files:
  - apps/desktop/dist/**/*
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
  - package.json
asar: true
asarUnpack:
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
npmRebuild: false
extraMetadata:
  main: apps/desktop/dist/main/index.js
win:
  target:
    - nsis
  artifactName: SeaShard-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  artifactName: SeaShard-${version}-macos-${arch}.${ext}
  category: public.app-category.utilities
  sign: null
linux:
  target:
    - AppImage
    - deb
  artifactName: SeaShard-${version}-linux-${arch}.${ext}
  category: Utility
