appId: studio.sealantern.seashard
productName: SeaShard
copyright: Copyright © SeaLantern Studio
directories:
  output: release
publish:
  provider: github
  owner: SeaLantern-Studio
  repo: SeaShard
files:
  - apps/desktop/dist/**/*
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
  - package.json
asar: true
asarUnpack:
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
npmRebuild: false
extraMetadata:
  main: apps/desktop/dist/main/index.js
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.utilities
  sign: null
linux:
  target:
    - AppImage
    - deb
  category: Utility
