appId: studio.sealantern.seashard
productName: SeaShard
copyright: Copyright © SeaLantern Studio
directories:
  output: release
publish:
  provider: github
  owner: SeaLantern-Studio
  repo: SeaShard
artifactName: SeaShardSetup.${ext}
files:
  - apps/desktop/dist/**/*
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
  - package.json
asar: true
asarUnpack:
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
npmRebuild: false
extraMetadata:
  main: apps/desktop/dist/main/index.js
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - pkg
  category: public.app-category.utilities
  sign: null
pkg:
  extraPkgsDir: macos-controller-extra-pkgs
linux:
  target:
    - AppImage
    - deb
  category: Utility
  extraResources:
    - from: build/linux-controller-host-installer/SeaShardHostSetup.AppImage
      to: host-installer/SeaShardHostSetup.AppImage
deb:
  afterInstall: build/linux-controller-after-install.tpl
  # Controller DEB 会启动内嵌的独立 Host AppImage；通过包依赖确保 AppImage
  # 在 Debian、Ubuntu 与 Kali 的新旧 FUSE2 包命名下都能直接运行。
  # 使用 fpm 追加依赖，避免 deb.depends 覆盖 electron-builder 的默认依赖集。
  fpm:
    - --depends
    - libfuse2t64 | libfuse2
