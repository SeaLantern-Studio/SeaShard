appId: studio.sealantern.seashard.host
productName: SeaShard Host
copyright: Copyright © SeaLantern Studio
directories:
  output: build/host-installer
publish:
  provider: github
  owner: SeaLantern-Studio
  repo: SeaShard
artifactName: SeaShardHostSetup.${ext}
files:
  - apps/host/dist/**/*
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
  - package.json
asar: true
asarUnpack:
  - apps/host/dist/**/*
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
npmRebuild: false
extraMetadata:
  name: seashard-host
  main: apps/host/dist/index.js
win:
  executableName: SeaShardHost
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  runAfterFinish: false
  include: build/host-installer.nsh
mac:
  executableName: SeaShardHost
  target:
    - pkg
  category: public.app-category.utilities
  sign: null
  extraResources:
    - from: scripts/uninstall-seashard.sh
      to: uninstaller/uninstall-seashard.sh
    - from: scripts/install-macos-uninstaller-app.sh
      to: uninstaller/install-macos-uninstaller-app.sh
pkg:
  scripts: build/macos-host-scripts
linux:
  executableName: seashard-host
  target:
    - AppImage
    - deb
  category: Utility
  extraResources:
    - from: scripts/uninstall-seashard.sh
      to: uninstaller/uninstall-seashard.sh
    - from: scripts/install-macos-uninstaller-app.sh
      to: uninstaller/install-macos-uninstaller-app.sh
deb:
  afterInstall: build/linux-host-after-install.tpl
  afterRemove: build/linux-host-after-remove.tpl
  fpm:
    - --before-remove
    - build/linux-host-before-remove.sh
    - --depends
    - libasound2t64 | libasound2
