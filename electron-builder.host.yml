appId: studio.sealantern.seashard.host
productName: SeaShard Host
copyright: Copyright © SeaLantern Studio
directories:
  output: build/host-installer
publish:
  provider: github
  owner: SeaLantern-Studio
  repo: SeaShard
artifactName: SeaShardHostSetup.${ext}
files:
  - apps/host/dist/**/*
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
  - package.json
asar: true
asarUnpack:
  - apps/host/dist/**/*
  - apps/plugin-host/dist/**/*
  - apps/database-worker/dist/**/*
npmRebuild: false
extraMetadata:
  main: apps/host/dist/index.js
win:
  executableName: SeaShardHost
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  runAfterFinish: false
  include: build/host-installer.nsh
